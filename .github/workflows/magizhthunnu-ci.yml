name: magizhthunnu CI

on:
  push:
    branches: ['**']
    paths: ['magizhthunnu/**']
  pull_request:
    branches: [main]
    paths: ['magizhthunnu/**']

jobs:
  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magizhthunnu/backend
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: magizhthunnu/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-at-least-32chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars!!
          REDIS_URL: redis://localhost:6379

  frontend:
    name: Frontend — lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magizhthunnu/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: magizhthunnu/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
